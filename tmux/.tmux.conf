################################################################################
# ~/.tmux.conf — tmux configuration
#
# Maintained in: ~/Documents/dotfiles/tmux/.tmux.conf  (symlinked to ~/.tmux.conf)
# Tested with:   tmux 3.6
#
# Layout of this file:
#   1. General behavior   (terminal, timing, history, indexing, mouse)
#   2. Key bindings       (reload, splits, vim-style pane nav, copy mode)
#   3. Appearance         (the red/yellow theme — status bar, panes, messages)
#
# Reload after editing:  prefix + r   (or:  tmux source-file ~/.tmux.conf)
# Prefix key:            Ctrl-b  (tmux default — see note in section 2)
################################################################################


###############################################################################
# 1. GENERAL BEHAVIOR
###############################################################################

# --- Colors / terminal --------------------------------------------------------
# Advertise a 256-color terminal to programs running inside tmux, and pass
# through 24-bit "true color" (RGB) so themes in nvim/bat/etc. look right.
# COLORTERM=truecolor + TERM=alacritty on this machine -> RGB is supported.
set -g  default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB:clipboard,xterm-256color:RGB:clipboard,xterm-ghostty:RGB:clipboard"

# --- Clipboard / OSC 52 (Mosh, SSH, and local) --------------------------------
# Let tmux send copied text directly to the outer terminal's clipboard using
# OSC 52 escape sequences. Mosh requires the BEL (\7) terminator and 'c' target.
set -s  set-clipboard on
set -as terminal-overrides ',xterm*:Ms=\E]52;c%p1%.0s;%p2%s\7'

# --- Image passthrough --------------------------------------------------------
# Let programs send escape sequences straight to the outer terminal. image.nvim
# needs this to draw markdown images (Sixel in iTerm2) from inside tmux.
set -gq allow-passthrough on

# --- Timing -------------------------------------------------------------------
# Kill the default 500ms wait after pressing Escape. Without this, hitting Esc
# in vim/nvim inside tmux feels laggy.
set -sg escape-time 10

# Let programs (nvim) know when the terminal gains/loses focus (autoread, etc.).
set -g focus-events on

# --- History / windows / titles -----------------------------------------------
set -g  history-limit 50000      # scrollback lines per pane
set -g  renumber-windows on      # keep window numbers gapless after closing one
set -g  set-titles on            # update terminal window/tab title in iTerm2
set -g  set-titles-string "#S: #W"

# --- Indexing -----------------------------------------------------------------
# Start windows and panes at 1 instead of 0 (matches the keyboard number row).
set -g  base-index 1
setw -g pane-base-index 1

# --- Mouse --------------------------------------------------------------------
set -g  mouse on                 # click panes/windows, drag borders, scroll

# --- Activity/bell: stay quiet ------------------------------------------------
# Don't flash, beep, or highlight on bell/activity/silence — no distractions.
set -g  visual-activity off
set -g  visual-bell     off
set -g  visual-silence  off
setw -g monitor-activity off
set -g  bell-action     none


###############################################################################
# 2. KEY BINDINGS
###############################################################################
# NOTE ON THE PREFIX: this config keeps tmux's default prefix, Ctrl-b. Many
# people remap it to Ctrl-a (easier to reach). To do that, uncomment the block
# below, then reload:
#
#   unbind C-b
#   set -g prefix C-a
#   bind C-a send-prefix
#
# All bindings below are pressed AFTER the prefix (e.g. "prefix + r").

# Reload this config without restarting tmux.
bind r source-file ~/.tmux.conf \; display-message "  ~/.tmux.conf reloaded"

# --- Splits -------------------------------------------------------------------
# Add intuitive | and - split keys that ALSO keep the current directory.
# (The default % and " keys still work too.)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Open new windows in the current directory as well.
bind c new-window -c "#{pane_current_path}"

# --- Vim-style pane selection -------------------------------------------------
# prefix + h/j/k/l  ->  move left/down/up/right between panes.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeat Shift+h/j/k/l after the prefix to resize panes by five cells.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Searchable session/window tree; z toggles a pane between full size and layout.
bind s choose-tree -Zs
bind z resize-pane -Z

# --- Copy mode (vi keys) ------------------------------------------------------
# Use vi keybindings in copy mode (prefix + [ to enter, then v/y like vim).
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


###############################################################################
# 3. APPEARANCE  (red + yellow theme)
###############################################################################

# --- Clock mode (prefix + t) --------------------------------------------------
setw -g clock-mode-colour yellow

# --- Copy-mode selection highlight --------------------------------------------
# Plain inverse video: tmux swaps each cell's own fg/bg instead of repainting
# the region black-on-red, so a selection looks like a normal terminal
# selection and the text under it stays readable.
setw -g mode-style 'reverse'

# --- Pane borders -------------------------------------------------------------
# Active pane is red; inactive pane is subtle gray
set -g pane-border-style        'fg=brightblack'
set -g pane-active-border-style 'fg=red'

# --- Status bar ---------------------------------------------------------------
set -g status-position bottom
set -g status-justify  left
set -g status-style    'fg=red'
set -g status-interval 1          # Refresh every 1 second so seconds update live

# Left side: empty.
set -g status-left ''
set -g status-left-length 10

# Right side: current folder + date + 12-hour clock with live seconds + timezone
# e.g. "thesis 2026-10-27 09:25:40 AM PST"
set -g status-right-length 85
set -g status-right '#[fg=white,bg=black] #{b:pane_current_path} #[fg=black,bg=yellow] %Y-%m-%d %I:%M:%S %p %Z '

# Current window: solid red tab (black-on-red).
setw -g window-status-current-style  'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

# Other windows: red index, white name, yellow flags.
setw -g window-status-style  'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

# A window with a bell pending.
setw -g window-status-bell-style 'fg=yellow bg=red bold'

# --- Messages / command prompt ------------------------------------------------
set -g message-style 'fg=yellow bg=red bold'


###############################################################################
# OPTIONAL EXTRAS (disabled — uncomment if you want them)
###############################################################################
# Auto-lock with a matrix screensaver after 2 min idle (needs `cmatrix`):
#   set -g lock-after-time 120
#   set -g lock-command "cmatrix -abs"
#
# Auto-save sessions every 15 min (add above the `run` line in section 4):
#   set -g @plugin 'tmux-plugins/tmux-continuum'


###############################################################################
# 4. PLUGINS  (tpm — lives in ~/.tmux/plugins/tpm)
###############################################################################
# After adding a plugin here:  prefix + I  to install it.
set -g @plugin 'tmux-plugins/tpm'

# --- Session save/restore -----------------------------------------------------
# prefix + Ctrl-s  ->  save all sessions, windows, panes and working dirs.
# prefix + Ctrl-r  ->  restore them (e.g. after a reboot).
set -g @plugin 'tmux-plugins/tmux-resurrect'

# --- Copy to the system clipboard ---------------------------------------------
# Anything highlighted in copy mode lands in the system clipboard:
# `y` after a keyboard selection, or just releasing the mouse after a drag.
# This replaces the plain `y` binding from section 2.
# prefix + y  ->  copy the current command line;  prefix + Y  ->  copy the cwd.
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'
# When on a local Wayland session, use wl-copy; otherwise let tmux's native OSC 52
# send the clipboard sequence to the remote terminal (Mosh / SSH).
set -g @override_copy_command 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; elif [ -n "$DISPLAY" ]; then xclip -selection clipboard; else cat > /dev/null; fi'

run '~/.tmux/plugins/tpm/tpm'                    # keep this line LAST
